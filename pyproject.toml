[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hash-service"
version = "1.0.0"
description = "REST API for computing and verifying hashes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
